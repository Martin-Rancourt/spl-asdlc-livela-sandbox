name: pr

# Set up by spl-asdlc 1.4.1 from docs/setup/examples/pr.yml, pinned at v1.4.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, 'release/**']

concurrency:
  group: pr-${{ github.ref }}-${{ github.event.pull_request.draft }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guards:
    if: github.event.pull_request.draft == false
    permissions:
      contents: read
    uses: Martin-Rancourt/spl-asdlc/.github/workflows/asdlc-pr-guards.yml@v1.4
    with:
      base-sha: ${{ github.event.pull_request.base.sha }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      head-ref: ${{ github.event.pull_request.head.ref }}
      base-ref: ${{ github.event.pull_request.base.ref }}
      head-repo: ${{ github.event.pull_request.head.repo.full_name }}
      # guards also refuses a PR whose .spl-asdlc/process.md is not the page
      # of the version named after the @ above (docs/setup/repository.md,
      # "The process page").
      # The same list as the gate's (release-gate.yml): a guard that runs on
      # PRs also runs on the candidate, or carries a written exception (REQ-CI-033).
      guard-commands: '[]'

  # The project's own suite: skipped on a prose-only PR (guards reports no
  # code), and on drafts as every job.
  test:
    needs: guards
    if: github.event.pull_request.draft == false && needs.guards.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Test
        run: |
          cargo fmt --all --check && cargo clippy --all-targets --locked -- -D warnings && cargo test --locked

  # always(): it runs whatever its needs gave, but never on a draft.
  required-check:
    name: required-check
    if: always() && github.event.pull_request.draft == false
    needs: [guards, test]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: Martin-Rancourt/spl-asdlc/actions/required-check@v1.4
        with:
          needs: ${{ toJSON(needs) }}
          may-skip: test

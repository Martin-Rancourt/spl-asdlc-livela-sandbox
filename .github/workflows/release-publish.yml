name: release-publish

# Set up by spl-asdlc 1.4.1 from docs/setup/examples/release-publish.yml, pinned at v1.4.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release-tag:
        description: The published release tag to resume; empty on a replay.
        type: string
        default: ''
      resume-from:
        description: The RC tag to redeploy (a resume); empty otherwise.
        type: string
        default: ''
      replay:
        description: Merge the release branch back only; dispatch on that branch.
        type: boolean
        default: false

concurrency:
  group: release-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.replay) }}
    permissions:
      contents: read
      actions: read
    uses: Martin-Rancourt/spl-asdlc/.github/workflows/asdlc-release-publish.yml@v1.4
    with:
      stage: verify
      release-tag: ${{ github.event.release.tag_name || inputs.release-tag }}
      resume-from: ${{ inputs.resume-from }}
      candidate-tag: spl-asdlc-livela-sandbox-v{version}-rc.{rc}
      release-tag-pattern: spl-asdlc-livela-sandbox-v{version}
      # As `[release] record` and the keys of `[[release.angles]]`: the latest
      # candidate's own QA reports may land after it. `[]` with no QA angle.
      qa-record: .spl-asdlc/qa/{candidate}/
      qa-angles: '[]'
      # The slug of the bridge's App. The release must have been published by
      # this App or by a person (spec 09); any other bot is no GO.
      go-publisher-login: spl-asdlc
      # The gate is `[release] gate_workflow`, read from `config-file`
      # (default `.spl-asdlc/config.toml`) at the release's commit: no
      # `gate-workflow` to repeat (`doctor` flags one that differs).

  # The project's own job: publish and deploy the verified commit.
  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify.outputs.deploy-sha }}
          persist-credentials: false
      - name: Publish
        run: |
          echo "Nothing is published yet: this job is the project's publication and deployment."

  # Always called: its `closing-guard` turns a close that did not run after a
  # publication into a red run.
  close:
    needs: [verify, publish]
    if: ${{ always() }}
    permissions:
      contents: read
      actions: read
    uses: Martin-Rancourt/spl-asdlc/.github/workflows/asdlc-release-publish.yml@v1.4
    with:
      stage: close
      release-tag: ${{ github.event.release.tag_name || inputs.release-tag }}
      resume-from: ${{ inputs.resume-from }}
      replay: ${{ inputs.replay || false }}
      publish-result: ${{ needs.publish.result }}
    secrets:
      SPL_ASDLC_APP_ID: ${{ secrets.SPL_ASDLC_APP_ID }}
      SPL_ASDLC_APP_PRIVATE_KEY: ${{ secrets.SPL_ASDLC_APP_PRIVATE_KEY }}
